name: fetch-monsters
on:
  push:
    paths: ['tools/fetch_monsters.sh', 'tools/opt_mon.mjs', '.github/workflows/monsters.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p free && bash tools/fetch_monsters.sh
      - name: Optimize for phones
        run: |
          if [ -f tools/opt_mon.mjs ]; then npm i --no-save @gltf-transform/core@4 @gltf-transform/functions@4 @gltf-transform/extensions@4 sharp && node tools/opt_mon.mjs; fi
      - name: Commit
        run: |
          git config user.name "splat-bot"; git config user.email "bot@users.noreply.github.com"
          git add free/monsters_listing.txt game/mon 2>/dev/null; git commit -m "Add Quaternius monsters" || echo "nothing to commit"; git pull --rebase; git push
