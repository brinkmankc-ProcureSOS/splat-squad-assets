name: fetch-free-assets
on:
  push:
    paths: ['tools/fetch_ph_models.py', 'tools/opt_ph.mjs', '.github/workflows/free.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: python3 tools/fetch_ph_models.py
      - run: npm i --no-save @gltf-transform/core@4 @gltf-transform/functions@4 @gltf-transform/extensions@4 meshoptimizer sharp && node tools/opt_ph.mjs
      - run: du -sh game/ph; ls -la game/ph | head -60
      - name: Commit
        run: |
          git config user.name "splat-bot"; git config user.email "bot@users.noreply.github.com"
          git add game/ph; git commit -m "Add optimized Poly Haven props" || echo "nothing to commit"; git pull --rebase; git push
